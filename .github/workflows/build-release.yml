name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part app version to build, for example 0.9.3.2. Leave empty to use Package.appxmanifest.
        required: false
        type: string
      configuration:
        description: Build configuration
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release
      publish_release:
        description: Create/update the GitHub Release and upload release assets.
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*.*.*.*'
      - '*.*.*.*'
  release:
    types:
      - published

permissions:
  contents: write

env:
  SOLUTION_PATH: ModernFlyouts.sln
  APP_PROJECT: ModernFlyouts\ModernFlyouts.csproj
  PACKAGE_PROJECT: ModernFlyouts.Package\ModernFlyouts.Package.wapproj
  PACKAGE_MANIFEST: ModernFlyouts.Package\Package.appxmanifest
  APPINSTALLER_PATH: ModernFlyouts.Package\Package.appinstaller
  PACKAGE_OUTPUT_DIR: ModernFlyouts.Package\AppPackages\CI\
  RELEASE_ASSET_DIR: ModernFlyouts.Package\AppPackages\ReleaseAssets\
  APPX_BUNDLE_PLATFORMS: x86|x64
  MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
  MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
  SELF_SIGNED_PFX_PASSWORD: ${{ secrets.SELF_SIGNED_PFX_PASSWORD }}

jobs:
  build:
    name: Build MSIX bundle
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          # The app/core projects target net6.0-windows; tests target net9.0-windows.
          dotnet-version: |
            6.0.x
            9.0.x

      # TODO: after the first full successful run, add actions/cache for NuGet/MSBuild outputs.

      - name: Resolve and stamp package version
        id: version
        shell: pwsh
        run: |
          function Assert-Version($value, $source) {
            if ($value -notmatch '^v?\d+\.\d+\.\d+\.\d+$') {
              throw "$source '$value' must be a four-part app version with optional leading v, for example v0.9.3.2."
            }
          }

          [xml]$manifest = Get-Content $env:PACKAGE_MANIFEST
          $manifestVersion = $manifest.Package.Identity.Version
          Assert-Version $manifestVersion 'Package.appxmanifest Identity.Version'

          $eventName = '${{ github.event_name }}'
          $tagName = ''
          $requestedVersion = ''

          if ($eventName -eq 'release') {
            $tagName = '${{ github.event.release.tag_name }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $tagName = '${{ github.ref_name }}'
          } elseif ($eventName -eq 'workflow_dispatch') {
            $requestedVersion = '${{ inputs.version }}'.Trim()
          }

          if ($tagName) {
            Assert-Version $tagName 'Release tag'
            $packageVersion = $tagName -replace '^v', ''
            $releaseTag = $tagName
          } elseif ($requestedVersion) {
            Assert-Version $requestedVersion 'Workflow version input'
            $packageVersion = $requestedVersion -replace '^v', ''
            $releaseTag = "v$packageVersion"
          } else {
            $packageVersion = $manifestVersion -replace '^v', ''
            $releaseTag = "v$packageVersion"
          }

          Assert-Version $packageVersion 'Resolved package version'

          $manifest.Package.Identity.Version = $packageVersion
          $manifest.Save((Resolve-Path $env:PACKAGE_MANIFEST))

          [xml]$appProject = Get-Content $env:APP_PROJECT
          $propertyGroup = @($appProject.Project.PropertyGroup | Where-Object { -not $_.Condition })[0]
          foreach ($name in @('Version', 'AssemblyVersion', 'FileVersion', 'InformationalVersion')) {
            if (-not $propertyGroup.$name) {
              $node = $appProject.CreateElement($name)
              [void]$propertyGroup.AppendChild($node)
            }

            $propertyGroup.$name = $packageVersion
          }
          $appProject.Save((Resolve-Path $env:APP_PROJECT))

          if (Test-Path $env:APPINSTALLER_PATH) {
            [xml]$appInstaller = Get-Content $env:APPINSTALLER_PATH
            $appInstaller.AppInstaller.Version = $packageVersion
            $appInstaller.AppInstaller.Uri = "https://github.com/Astear17/GlobalFlyouts/releases/download/$releaseTag/GlobalFlyouts.appinstaller"
            $appInstaller.AppInstaller.MainBundle.Name = 'Astear17.GlobalFlyouts'
            $appInstaller.AppInstaller.MainBundle.Publisher = 'CN=Astear17'
            $appInstaller.AppInstaller.MainBundle.Version = $packageVersion
            $appInstaller.AppInstaller.MainBundle.Uri = "https://github.com/Astear17/GlobalFlyouts/releases/download/$releaseTag/GlobalFlyouts-$packageVersion-x86_x64.msixbundle"
            $appInstaller.Save((Resolve-Path $env:APPINSTALLER_PATH))
          }

          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Prepare package signing certificate
        id: signing
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE 'ModernFlyouts.Package\ModernFlyouts.Package_TemporaryKey.pfx'
          $cerPath = Join-Path $env:GITHUB_WORKSPACE 'ModernFlyouts.Package\ModernFlyouts.Package_TemporaryKey.cer'

          if ($env:MSIX_PFX_BASE64) {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
            $password = $env:MSIX_PFX_PASSWORD
            if (-not $password) {
              throw 'MSIX_PFX_PASSWORD must be set when MSIX_PFX_BASE64 is provided.'
            }

            $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
            Export-Certificate -Cert $cert -FilePath $cerPath -Force | Out-Null
            "certificate_source=secret" >> $env:GITHUB_OUTPUT
            "certificate_thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
            "PACKAGE_CERT_PASSWORD=$password" >> $env:GITHUB_ENV
          } else {
            $password = $env:SELF_SIGNED_PFX_PASSWORD
            if (-not $password) {
              throw 'SELF_SIGNED_PFX_PASSWORD repository secret must be set when MSIX_PFX_BASE64 is not provided.'
            }

            $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject 'CN=Astear17' `
              -KeyUsage DigitalSignature `
              -FriendlyName 'Astear17 GlobalFlyouts CI Test Certificate' `
              -CertStoreLocation Cert:\CurrentUser\My `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')

            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword -Force | Out-Null
            Export-Certificate -Cert $cert -FilePath $cerPath -Force | Out-Null
            "certificate_source=self-signed-test" >> $env:GITHUB_OUTPUT
            "certificate_thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
            "PACKAGE_CERT_PASSWORD=$password" >> $env:GITHUB_ENV
          }

      - name: Restore and build package
        shell: pwsh
        run: |
          $configuration = '${{ inputs.configuration }}'
          if (-not $configuration) {
            $configuration = 'Debug'
          }

          msbuild $env:SOLUTION_PATH `
            /restore `
            /m `
            /nr:false `
            /p:Configuration=$configuration `
            /p:Platform=x64 `
            "/p:AppxBundlePlatforms=$env:APPX_BUNDLE_PLATFORMS" `
            "/p:AppxPackageDir=$env:PACKAGE_OUTPUT_DIR" `
            /p:AppxPackageSigningEnabled=true `
            "/p:PackageCertificateKeyFile=ModernFlyouts.Package_TemporaryKey.pfx" `
            "/p:PackageCertificatePassword=$env:PACKAGE_CERT_PASSWORD" `
            "/p:PackageCertificateThumbprint=${{ steps.signing.outputs.certificate_thumbprint }}" `
            "/p:Version=${{ steps.version.outputs.package_version }}" `
            "/p:AssemblyVersion=${{ steps.version.outputs.package_version }}" `
            "/p:FileVersion=${{ steps.version.outputs.package_version }}" `
            "/p:InformationalVersion=${{ steps.version.outputs.package_version }}" `
            /v:minimal

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.package_version }}'
          $releaseAssetDir = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ASSET_DIR
          $packageOutputDir = Join-Path $env:GITHUB_WORKSPACE $env:PACKAGE_OUTPUT_DIR

          if (Test-Path $releaseAssetDir) {
            Remove-Item $releaseAssetDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $releaseAssetDir -Force | Out-Null

          $bundle = Get-ChildItem -Path $packageOutputDir -Recurse -Filter '*.msixbundle' | Select-Object -First 1
          if (-not $bundle) {
            throw "No .msixbundle was produced under $packageOutputDir."
          }

          $cer = Get-ChildItem -Path $packageOutputDir -Recurse -Filter '*.cer' | Select-Object -First 1
          if (-not $cer) {
            $cer = Get-Item (Join-Path $env:GITHUB_WORKSPACE 'ModernFlyouts.Package\ModernFlyouts.Package_TemporaryKey.cer')
          }

          $generatedInstaller = Get-ChildItem -Path $packageOutputDir -Recurse -Filter 'Install.ps1' | Select-Object -First 1
          if (-not $generatedInstaller) {
            throw "No generated package Install.ps1 was produced under $packageOutputDir."
          }

          $notice = @"
          # Package signing notice

          Package version: $version
          Certificate source: ${{ steps.signing.outputs.certificate_source }}

          Release assets:
          - GlobalFlyouts-$version-msixbundle.zip: full install package, dependencies, generated Install.ps1, and certificate.
          - GlobalFlyouts-$version-x86_x64.msixbundle: standalone MSIX bundle for manual sideloading.
          - GlobalFlyouts-$version.cer: signing certificate for manual sideloading.
          - GlobalFlyouts-$version-Install.ps1: generated package installer copied from the MSIX packaging output.

          If certificate source is `self-signed-test`, the package is not production-signed. Installers must trust the generated `.cer` certificate before sideloading the `.msixbundle`.
          The package manifest publisher is `CN=Astear17`, so any production certificate supplied through `MSIX_PFX_BASE64` must match that publisher identity or the MSIX signing step will fail.
          "@

          $noticePath = Join-Path $releaseAssetDir 'SIGNING-NOTICE.md'
          Set-Content -Path $noticePath -Value $notice -Encoding UTF8

          Copy-Item $bundle.FullName (Join-Path $releaseAssetDir "GlobalFlyouts-$version-x86_x64.msixbundle") -Force
          Copy-Item $cer.FullName (Join-Path $releaseAssetDir "GlobalFlyouts-$version.cer") -Force
          Copy-Item $generatedInstaller.FullName (Join-Path $releaseAssetDir "GlobalFlyouts-$version-Install.ps1") -Force

          $archivePath = Join-Path $releaseAssetDir "GlobalFlyouts-$version-msixbundle.zip"
          Compress-Archive `
            -Path (Join-Path $packageOutputDir '*') `
            -DestinationPath $archivePath `
            -Force

          "release_asset_dir=$releaseAssetDir" >> $env:GITHUB_OUTPUT

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlobalFlyouts-${{ steps.version.outputs.package_version }}-release-assets
          path: |
            ModernFlyouts.Package\AppPackages\CI\**
            ModernFlyouts.Package\AppPackages\ReleaseAssets\**

      - name: Attach assets to GitHub release
        if: github.event_name == 'release' || github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            ModernFlyouts.Package\AppPackages\ReleaseAssets\*
